name: Generate WhatsApp preview image
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/generate_preview.py'
      - '.github/workflows/preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering libraries
        run: python -m pip install cairosvg==2.8.2 pillow==11.3.0
      - name: Render illustrated social preview
        run: python scripts/generate_preview.py
      - name: Commit preview image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview.png
          if git diff --cached --quiet; then
            echo "Preview has not changed."
          else
            git commit -m "Update WhatsApp preview [skip ci]"
            git push
          fi
